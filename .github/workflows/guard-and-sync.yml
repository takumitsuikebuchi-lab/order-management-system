name: Guard And Deploy

# main への push で「チェック → テスト → 合格したときだけ本番（GitHub Pages）へ反映」する。
# 2026-10-09 変更: 以前は master ブランチを Pages がそのまま配信しており、テストに落ちても本番に出る経路があった。
#   今は Pages の配信元を「GitHub Actions」にし、テスト合格後に deploy ジョブが配信する。
#   配信するのはアプリに必要なファイル（index.html / styles.css / utils.js / cloud-config.json）だけ。
#   master は main のミラーとして残している（配信には使っていない）。

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: guard-and-deploy-${{ github.ref }}
  # PR の検証は新しい push で打ち切ってよいが、本番反映の途中では止めない
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: 共有クラウド設定の照合と構文チェック（ES2019 まで）
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI tests
        run: npm run test:ui

      - name: 失敗したテストの記録を保存（Actions の画面からダウンロードできる）
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: 配信するファイルだけを集める
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp index.html styles.css utils.js cloud-config.json _site/
          touch _site/.nojekyll

      - name: 配信用ファイルを保存
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: 本番（GitHub Pages）へ反映
        id: deployment
        uses: actions/deploy-pages@v5

  sync-master:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to master（ミラー）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:master
