name: Guard And Sync

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

concurrency:
  group: guard-and-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify shared config exists
        run: test -f cloud-config.json

      - name: Verify shared config shape
        run: |
          node -e "const cfg=require('./cloud-config.json'); if (!cfg.url || !cfg.anonKey || typeof cfg.enabled !== 'boolean') { throw new Error('cloud-config.json is invalid'); }"

      - name: Verify index.html fallback matches cloud-config.json
        run: |
          node -e "
            const fs = require('fs');
            const cfg = require('./cloud-config.json');
            const html = fs.readFileSync('index.html', 'utf8');
            // EMBEDDED_SHARED_CLOUD_CONFIG ブロックだけを対象に抽出して厳密比較する
            const embMatch = html.match(/EMBEDDED_SHARED_CLOUD_CONFIG\s*=\s*\{([\s\S]*?)\};/);
            if (!embMatch) throw new Error('EMBEDDED_SHARED_CLOUD_CONFIG block not found in index.html');
            const block = embMatch[1];
            const urlMatch = block.match(/url:\s*'(https:\/\/[a-z0-9-]+\.supabase\.co)'/);
            const keyMatch = block.match(/anonKey:\s*'(eyJ[^']{50,})'/);
            const enabledMatch = block.match(/enabled:\s*(true|false)/);
            if (!urlMatch) throw new Error('Embedded URL not found');
            if (!keyMatch) throw new Error('Embedded anonKey not found');
            if (!enabledMatch) throw new Error('Embedded enabled flag not found');
            if (urlMatch[1] !== cfg.url) throw new Error('Embedded URL does not match cloud-config.json: ' + urlMatch[1]);
            if (keyMatch[1] !== cfg.anonKey) throw new Error('Embedded anonKey does not match cloud-config.json');
            if ((enabledMatch[1] === 'true') !== cfg.enabled) throw new Error('Embedded enabled flag does not match cloud-config.json');
            console.log('OK: embedded fallback matches cloud-config.json (url/anonKey/enabled)');
          "

      - name: Verify index.html script syntax
        run: |
          node -e "const fs=require('fs'); const vm=require('vm'); const html=fs.readFileSync('index.html','utf8'); const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)]; if(!scripts.length) throw new Error('script not found'); scripts.forEach((m,i)=>new vm.Script(m[1],{filename:'script-'+i+'.js'}));"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run UI smoke tests
        run: npm run test:ui

  sync-master:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Push main to master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:master
