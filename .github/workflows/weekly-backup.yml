name: Weekly Backup

on:
  schedule:
    # 火曜日 15:00 UTC = 日本時間 水曜日 0:00（cron 曜日2=火曜）
    - cron: '0 15 * * 2'
  workflow_dispatch:
    # GitHub画面から手動実行も可能（テスト・緊急バックアップ用）

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 受注データをCSV出力
        run: |
          SUPABASE_URL=$(jq -r '.url' cloud-config.json)
          SUPABASE_KEY=$(jq -r '.anonKey' cloud-config.json)
          DATE=$(TZ='Asia/Tokyo' date +%Y-%m-%d)

          mkdir -p backups

          # Range-Unit: items + Prefer: count=exact のレスポンスヘッダ Content-Range: 0-N/TOTAL から
          # 総件数を取得し、page_size 単位で分割取得して CSV を連結する。10万件を超えても欠損しない設計。
          export_csv_with_bom() {
            local url="$1"
            local output_path="$2"
            local tmp_file page_tmp headers_file cr_line parsed_total
            local offset=0
            local page_size=10000
            local total=999999
            local is_first=1

            tmp_file=$(mktemp)

            while [ $offset -lt $total ]; do
              local range_end=$((offset + page_size - 1))
              page_tmp=$(mktemp)
              headers_file=$(mktemp)

              curl -sf "${url}" \
                -H "apikey: ${SUPABASE_KEY}" \
                -H "Authorization: Bearer ${SUPABASE_KEY}" \
                -H "Accept: text/csv" \
                -H "Range-Unit: items" \
                -H "Range: ${offset}-${range_end}" \
                -H "Prefer: count=exact" \
                -D "${headers_file}" \
                -o "${page_tmp}"

              cr_line=$(grep -i '^content-range:' "${headers_file}" | head -n1 | tr -d '\r\n')
              parsed_total=$(echo "$cr_line" | sed -nE 's|.*/([0-9]+).*|\1|p')
              if [ -n "$parsed_total" ]; then total="$parsed_total"; fi

              if [ "$is_first" -eq 1 ]; then
                cat "${page_tmp}" > "${tmp_file}"
                is_first=0
              else
                tail -n +2 "${page_tmp}" >> "${tmp_file}"
              fi

              rm -f "${page_tmp}" "${headers_file}"
              offset=$((offset + page_size))

              # 安全装置: 100万件を超える異常値で中断
              if [ $offset -ge 1000000 ]; then
                echo "警告: 100万件を超える取得を検出、中断します" >&2
                break
              fi
            done

            printf '\xEF\xBB\xBF' > "${output_path}"
            cat "${tmp_file}" >> "${output_path}"
            rm -f "${tmp_file}"
          }

          # 受注明細（全件・日付昇順）※Supabase REST上限1000件を回避するため Range + count=exact でページング
          export_csv_with_bom \
            "${SUPABASE_URL}/rest/v1/orders?select=*&order=date.asc,order_no.asc" \
            "backups/${DATE}_受注明細.csv"

          echo "受注明細: $(wc -l < backups/${DATE}_受注明細.csv) 行（ヘッダー含む）"

          # 顧客マスタ ※同様にページングで上限回避
          export_csv_with_bom \
            "${SUPABASE_URL}/rest/v1/customers?select=*&order=customer_name.asc" \
            "backups/${DATE}_顧客マスタ.csv"

          echo "顧客マスタ: $(wc -l < backups/${DATE}_顧客マスタ.csv) 行（ヘッダー含む）"

          # シンプルマスタ（種類ごとにCSV分割） ※全件一括も別途保存
          export_simple_master() {
            local type_key="$1"
            local type_label="$2"

            export_csv_with_bom \
              "${SUPABASE_URL}/rest/v1/simple_masters?master_type=eq.${type_key}&select=*&order=sort_order.asc" \
              "backups/${DATE}_${type_label}マスタ.csv"

            echo "${type_label}マスタ: $(wc -l < backups/${DATE}_${type_label}マスタ.csv) 行（ヘッダー含む）"
          }

          export_simple_master "cargo"     "品名"
          export_simple_master "packaging" "荷姿"
          export_simple_master "unit"      "単位"
          export_simple_master "driver"    "ドライバー"
          export_simple_master "vehicle"   "車両"

          # シンプルマスタ全体（万一のためのフル複製）
          export_csv_with_bom \
            "${SUPABASE_URL}/rest/v1/simple_masters?select=*&order=master_type.asc,sort_order.asc" \
            "backups/${DATE}_シンプルマスタ全体.csv"

          echo "シンプルマスタ全体: $(wc -l < backups/${DATE}_シンプルマスタ全体.csv) 行（ヘッダー含む）"

      - name: バックアップをコミット
        run: |
          DATE=$(TZ='Asia/Tokyo' date +%Y-%m-%d)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backups/
          git diff --staged --quiet && echo "変更なし（データが空の可能性）" && exit 0

          git commit -m "backup: ${DATE} 週次自動バックアップ"
          git push origin main

          echo "バックアップ完了: backups/${DATE}_*.csv （受注明細・顧客マスタ・品名/荷姿/単位/ドライバー/車両マスタ・シンプルマスタ全体）"
